name: Tests

# Corre los tests que no necesitan base de datos ni claves. Son los de las
# reglas de negocio, que es justo la parte donde un error se paga caro.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
